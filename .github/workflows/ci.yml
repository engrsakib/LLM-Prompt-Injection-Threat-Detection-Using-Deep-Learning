name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_changed }}
      all_changed_files: ${{ steps.changed.outputs.all_changed_files }}
      py_changed_files: ${{ steps.filter.outputs.py_changed_files }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            setup.py

      - name: Filter changed Python files
        id: filter
        run: |
          py_files=""
          for f in ${{ steps.changed.outputs.all_changed_files }}; do
            if [[ "$f" == *.py ]]; then
              py_files+="$f "
            fi
          done
          echo "py_changed_files=${py_files}" >> "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: needs.changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Ruff lint (modified Python files)
        if: needs.changes.outputs.py_changed_files != ''
        run: |
          python -m ruff check ${{ needs.changes.outputs.py_changed_files }}

      - name: Ruff format check (modified Python files)
        if: needs.changes.outputs.py_changed_files != ''
        run: |
          python -m ruff format --check ${{ needs.changes.outputs.py_changed_files }}

      - name: Mypy type check (modified Python files)
        if: needs.changes.outputs.py_changed_files != ''
        run: |
          files=""
          for f in ${{ needs.changes.outputs.py_changed_files }}; do
            case "$f" in
              src/*.py|src/**/*.py|scripts/*.py)
                files+="$f "
                ;;
            esac
          done
          if [ -n "$files" ]; then
            python -m mypy --config-file pyproject.toml $files
          else
            echo "No src/scripts Python files modified; skipping mypy."
          fi

      - name: GPLv3 license header check (modified source files)
        if: needs.changes.outputs.py_changed_files != ''
        run: |
          python scripts/ci_check_license.py ${{ needs.changes.outputs.py_changed_files }}

      - name: Pytest (tests for modified modules)
        if: needs.changes.outputs.py_changed_files != ''
        run: |
          tests=$(python scripts/ci_select_tests.py ${{ needs.changes.outputs.py_changed_files }})
          echo "Running: pytest $tests"
          pytest $tests -v --tb=short

  skip:
    needs: changes
    if: needs.changes.outputs.any_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant files changed; skipping CI checks."

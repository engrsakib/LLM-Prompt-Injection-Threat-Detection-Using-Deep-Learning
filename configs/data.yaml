seed: 42

data:
  dataset: neuralchemy/prompt-injection-Threat-Matrix
  config: multiclass
  data_dir: data
  processed_dir: data/processed
  lowercase: false
  drop_invalid_rows: true

dedup:
  near_duplicate_threshold: 0.85

phase2:
  enabled: true
  balancing_strategy: oversample_median
  augmentation:
    enabled: true
    minority_only: true
    synonym_replace_prob: 0.25
    token_noise_prob: 0.10
    max_augmentations_per_row: 1
  mlflow:
    enabled: true
    experiment_name: data-engineering

phase3:
  enabled: true
  docs_dir: docs
  leakage_near_threshold: 0.85
  adversarial_paraphrase:
    enabled: true
    max_variants_per_row: 1
  mlflow:
    enabled: true
    experiment_name: data-engineering

# Phase 3.5: leakage-aware group re-split of the LOCAL raw snapshot (offline).
# Output: data/processed/splits/<version>/ (frozen manifest is the evaluation gate).
phase35:
  enabled: true
  version: v1_leakfree
  fractions: {train: 0.8, validation: 0.1, test: 0.1}
  near_threshold: 0.85          # MinHash/Jaccard for family linking + leakage audit
  within_split_dedup: near      # exact | near | none (applied inside each split only)
  template_pattern: '\s*\(example\s+\d+\)\s*$'
  tolerance: 0.02               # stratification tolerance before upstream split tie-break
  regenerate_train_variants: true
  build_kaggle_package: true
  allow_leakage_failure: false

output:
  processed_dir: data/processed
  reports_dir: data/processed/reports

dataset:
  source: "kagglehub"
  kagglehub_handle: "engrsakib02/neurological-disorders-mri-dataset-for-xai"
  kagglehub_fallback_handle: "alifatahi/multi-class-neurological-disorder-mcnd-dataset"
  kaggle_dataset: "engrsakib02/neurological-disorders-mri-dataset-for-xai"
  kaggle_data_subdir: "data"
  data_dir: "/kaggle/input/datasets/engrsakib02/neurological-disorders-mri-dataset-for-xai/data"
  gdrive_path: "/content/drive/MyDrive/neuro-mri-data/data"
  val_split: 0.1
  test_split: 0.1
  seed: 42
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  split_strategy: "patient"
  min_class_support_per_split: 1
  n_folds: 1
  fold_index: 0
  class_names:
    - AD_MildDemented
    - AD_ModerateDemented
    - AD_VeryMildDemented
    - BT_glioma
    - BT_meningioma
    - BT_pituitary
    - MS
    - Normal

model:
  backbone: "swin_base_patch4_window7_224"
  num_classes: 8
  pretrained: true
  drop_path_rate: 0.1
  use_lora: false
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: ["qkv", "proj"]
  lora_modules_to_save: ["head"]
  lora_dropout: 0.1

sam:
  enabled: false
  checkpoint: "sam_vit_b_01ec64.pth"
  model_type: "vit_b"
  weights_dir: "weights"

florence:
  enabled: true
  model_id: "microsoft/Florence-2-base"
  use_lora: false

training:
  epochs: 20
  lr: 1.0e-4
  backbone_lr: 1.0e-5
  weight_decay: 0.01
  early_stopping_patience: 5
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"
  use_amp: true
  use_cosine_scheduler: true
  freeze_early_backbone: false
  use_class_weights: true

vram:
  max_batch_size: 32
  sam_on_cpu: false
  sequential_models: true
  empty_cache_between: true

evaluation:
  figures_dir: "outputs/figures"
  run_sklearn_baselines: true
  export_batch_xai: false
  xai_max_samples: 16
  export_per_class_metrics: true

ensemble:
  enabled: false
  backbones:
    - "swin_base_patch4_window7_224"
    - "convnext_base.fb_in22k_ft_in1k"
    - "densenet121"
  checkpoint_paths: []
  weights: []

explainability:
  figures_dir: "outputs/figures"
  alpha: 0.4

report:
  output_dir: "outputs/reports"

# Backward-compatible alias; prefer dataset.class_names
classes:
  - AD_MildDemented
  - AD_ModerateDemented
  - AD_VeryMildDemented
  - BT_glioma
  - BT_meningioma
  - BT_pituitary
  - MS
  - Normal

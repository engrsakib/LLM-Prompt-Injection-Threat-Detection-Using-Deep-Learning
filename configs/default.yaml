# Legacy single-model config (kept for backwards compatibility).
# The 16-model study uses configs/experiment.yaml + configs/models/<model_id>.yaml via
#   python -m src.training.train_cli --model <model_id> --seed <seed>
seed: 42
model: distilbert
num_labels: 7
batch_size: 32
epochs: 4
learning_rate: 5e-5
data:
  dataset: neuralchemy/prompt-injection-Threat-Matrix
  config: multiclass
  processed_dir: data/processed
  splits_dir: data/processed/splits/v1_leakfree
  train_file: train.parquet
output_dir: outputs/
mlflow:
  tracking_uri: file:./mlruns
  experiment_name: prompt-injection

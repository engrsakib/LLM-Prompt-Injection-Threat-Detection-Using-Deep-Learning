stages:
  prepare:
    cmd: python -m src.data.prepare --config configs/data.yaml --phase 1
    deps:
      - configs/data.yaml
      - params.yaml
      - src/data/constants.py
      - src/data/cleaning.py
      - src/data/dedup.py
      - src/data/ingest.py
      - src/data/pipeline.py
      - src/data/prepare.py
      - src/data/reporting.py
      - src/data/validation.py
    params:
      - params.yaml
    outs:
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/test.parquet
      - data/processed/metadata.json
      - data/processed/reports/class_distribution.json
      - data/processed/reports/class_distribution.md
      - data/processed/reports/validation_report.json
      - data/processed/reports/dedup_report.json

  enrich:
    cmd: python -m src.data.enrich --config configs/data.yaml
    deps:
      - configs/data.yaml
      - params.yaml
      - data/processed/train.parquet
      - data/processed/validation.parquet
      - data/processed/test.parquet
      - src/data/analysis.py
      - src/data/augment.py
      - src/data/balancing.py
      - src/data/enrich.py
      - src/data/mlflow_tracking.py
      - src/data/obfuscation.py
    params:
      - params.yaml
    outs:
      - data/processed/train_balanced.parquet
      - data/processed/train_augmented.parquet
      - data/processed/reports/severity_buckets.json
      - data/processed/reports/severity_buckets.md
      - data/processed/reports/ambiguity_subsets.json
      - data/processed/subsets
